<!DOCTYPE html>
<html>
    <head>
        <title>Flexbox vs Grid</title>
        <link rel="stylesheet" href="style.CSS">
    </head>

    <body>
        <header>
            <h1>Flexbox vs CSS Grid</h1>
            <p>Understanding CSS Layout System</p>
        </header>

        <section class="flex-section">
            <h2>Flexbox Layout</h2>
            <div class="flex-container">
                <div class="box">HTML</div>
                <div class="box">CSS</div>
                <div class="box">Java</div>
                <div class="box">Python</div>
            </div>
        </section>

        <section class="flex-section">
            <h2>CSS Grid Layout</h2>
            <div class="grid-container">
                <div class="grid-item">HTML</div>
                <div class="grid-item">CSS</div>
                <div class="grid-item">Java</div>
                <div class="grid-item">Python</div>
            </div>
        </section>

        <footer>
            <p>Flexbox vs Grid Layout</p>
        </footer>
    </body>
</html>
